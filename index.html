<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Дома">
  <meta name="theme-color" content="#f5f5f7">
  <title>Дома</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css?v=31">
  <link rel="stylesheet" href="./menu.css?v=31">
  <link rel="stylesheet" href="./mcf.css?v=31">
  <link rel="stylesheet" href="./apple.css?v=31">
  <link rel="stylesheet" href="./gym.css?v=31">
  <link rel="stylesheet" href="./home.css?v=31">
  <link rel="stylesheet" href="./tabs.css?v=31">
</head>
<body>
  <div class="app">
    <header class="head">
      <h1 class="page-title" id="pageTitle">Главная</h1>
      <button class="who-pill" id="whoPill" onclick="cycleWho()">Я</button>
    </header>
    <h1 class="date-title" id="dateTitle" hidden></h1>
    <div class="row-pills" hidden>
      <button class="pill" id="modePill"></button>
      <div class="pill muted" id="clockChip"></div>
    </div>
    <main>
      <section id="home" class="page on"></section>
      <section id="menu" class="page" hidden></section>
      <section id="shop" class="page" hidden></section>
      <section id="gym" class="page" hidden></section>
      <section id="mail" class="page" hidden></section>
      <section id="fin" class="page" hidden></section>
    </main>
  </div>
  <nav class="tabbar">
    <div class="tab-pill">
      <button data-page="home" class="on" onclick="go('home')"><span class="ico" data-ic="home"></span>Главная</button>
      <button data-page="menu" onclick="go('menu')"><span class="ico" data-ic="book"></span>Меню</button>
      <button data-page="gym" onclick="go('gym')"><span class="ico" data-ic="run"></span>Зал</button>
      <button data-page="fin" onclick="go('fin')"><span class="ico" data-ic="cash"></span>Деньги</button>
    </div>
    <button class="fab" onclick="go('shop')" title="Закупки">+</button>
  </nav>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head"><b id="sheetTitle">Редактор</b><button class="icon-btn" onclick="closeSheet()">✕</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <script>
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
    }
  </script>
  <script src="./data.js?v=31"></script>
  <script src="./mail-cache.js?v=31"></script>
  <script src="./catalog.js?v=31"></script>
  <script src="./app.js?v=31"></script>
  <script src="./finance.js?v=31"></script>
  <script src="./menu-hero.js?v=31"></script>
  <script src="./menu.js?v=31"></script>
  <script src="./recipe.js?v=31"></script>
  <script src="./mcf-a.js?v=31"></script>
  <script src="./mcf-b.js?v=31"></script>
  <script src="./mcf.js?v=31"></script>
  <script src="./ui.js?v=31"></script>
  <script src="./gym-hero.js?v=31"></script>
  <script src="./gym.js?v=31"></script>
  <script src="./habits.js?v=31"></script>
  <script src="./home.js?v=31"></script>
  <script src="./pages.js?v=31"></script>
</body>
</html>
