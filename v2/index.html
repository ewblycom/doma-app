<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дома — вход</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f5f5f7;color:#1d1d1f}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.box{width:min(400px,100%)}
h1{margin:0 0 24px;font-size:40px;font-weight:600}
.seg{display:flex;background:#fff;border:1px solid #e0e0e0;border-radius:9999px;padding:4px;margin-bottom:24px}
.seg button{flex:1;min-height:44px;border:0;background:transparent;color:#7a7a7a;border-radius:9999px}
.seg button.on{background:#0066cc;color:#fff;font-weight:600}
.field{width:100%;height:44px;border:1px solid #e0e0e0;border-radius:11px;background:#fff;padding:0 17px;margin:0 0 12px;font:inherit}
.btn{width:100%;min-height:44px;border:0;border-radius:9999px;background:#0066cc;color:#fff;font:inherit}
.btn-text{background:transparent;color:#0066cc;border:0;font:inherit;padding:8px}
.err,.hint{font-size:14px;margin:0 0 12px}
.err{background:#fff;border:1px solid #e0e0e0;border-radius:11px;padding:12px}
.hint{color:#7a7a7a;text-align:center}
.choice{display:block;margin:0 0 8px;font-size:14px;color:#7a7a7a}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb = createClient(
  "https://nvxzplthqeqyihqzgacf.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52eHpwbHRocWVxeWlocXpnYWNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTY1NzQsImV4cCI6MjEwNTczMjU3NH0.FT5ve5zEFbnF_5Ac-aM3Mv_lingo9OgIGM6Y3h9xJfs"
);
const DASH = "../?v=34";
const root = document.getElementById("root");
const S = { screen:"login", error:"", busy:false, session:null };
const nice = m => {
  const t = String(m||"");
  if (/already registered/i.test(t)) return "Этот email уже есть. Откройте Вход.";
  if (/invalid login/i.test(t)) return "Неверный email или пароль.";
  if (/gen_random_bytes/i.test(t)) return "Нужен SQL без gen_random_bytes — напишите в чат.";
  if (/invalid invite/i.test(t)) return "Неверный код.";
  if (/household is full/i.test(t)) return "В доме уже двое.";
  return t;
};
function goDash(){ location.replace(DASH); }
async function hasHouse(){
  if (!S.session) return false;
  const { data } = await sb.from("profiles").select("id").eq("id", S.session.user.id).maybeSingle();
  return !!data;
}
function render(){
  const tabs = `<div class="seg"><button type="button" data-s="login" class="${S.screen==="login"?"on":""}">Вход</button><button type="button" data-s="register" class="${S.screen==="register"?"on":""}">Регистрация</button></div>`;
  const err = S.error ? `<div class="err">${S.error}</div>` : "";
  if (S.screen === "house") {
    root.innerHTML = `<div class="auth"><form class="box" id="houseForm"><h1>Ваш дом</h1>${err}<label class="choice"><input type="radio" name="mode" value="create" checked> Создать дом</label><input class="field" name="houseName" value="Дом"><label class="choice"><input type="radio" name="mode" value="join"> Вступить по коду</label><input class="field" name="invite" placeholder="Код"><button class="btn">${S.busy?"…":"Продолжить"}</button><p class="hint"><button class="btn-text" type="button" id="out">Выйти</button></p></form></div>`;
  } else {
    root.innerHTML = `<div class="auth"><div class="box"><h1>Дома</h1>${tabs}${err}<form id="authForm"><input class="field" name="email" type="email" required placeholder="Email"><input class="field" name="password" type="password" required minlength="6" placeholder="Пароль"><button class="btn">${S.busy?"…":(S.screen==="register"?"Создать аккаунт":"Войти и открыть сайт")}</button></form><p class="hint">После входа откроется полный дашборд: главная, меню, зал, деньги, почта.</p></div></div>`;
  }
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.screen=b.dataset.s;S.error="";render();});
  document.getElementById("out")?.addEventListener("click", async()=>{await sb.auth.signOut();S.session=null;S.screen="login";render();});
  document.getElementById("authForm")?.addEventListener("submit", async e=>{
    e.preventDefault(); const fd=new FormData(e.target);
    const email=String(fd.get("email")||"").trim(); const password=String(fd.get("password")||"");
    S.busy=true;S.error="";render();
    let error;
    if (S.screen==="register") {
      const up = await sb.auth.signUp({email,password});
      error = up.error;
      if (error && /already registered/i.test(error.message)) {
        const inn = await sb.auth.signInWithPassword({email,password}); error = inn.error;
      } else if (!up.data?.session && !error) {
        const inn = await sb.auth.signInWithPassword({email,password}); error = inn.error;
      }
    } else {
      const inn = await sb.auth.signInWithPassword({email,password}); error = inn.error;
    }
    S.busy=false;
    if (error){S.error=nice(error.message);render();return;}
    S.session=(await sb.auth.getSession()).data.session;
    if (await hasHouse()) goDash(); else { S.screen="house"; render(); }
  });
  document.getElementById("houseForm")?.addEventListener("submit", async e=>{
    e.preventDefault(); const fd=new FormData(e.target);
    S.busy=true;S.error="";render();
    const mode=String(fd.get("mode")||"create");
    const rpc = mode==="join"
      ? await sb.rpc("join_household",{p_code:String(fd.get("invite")||"").trim()})
      : await sb.rpc("create_household",{p_name:String(fd.get("houseName")||"Дом")});
    S.busy=false;
    if (rpc.error){S.error=nice(rpc.error.message);render();return;}
    goDash();
  });
}
(async()=>{
  S.session=(await sb.auth.getSession()).data.session;
  if (S.session && await hasHouse()) goDash();
  else if (S.session) S.screen="house";
  render();
})();
</script>
</body>
</html>
